name: Deploy Website to Firebase

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: saarthi-firebase-production
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: sankatmochan-509100
  VITE_SAARTHI_API_URL: https://sankatmochan-saarthi-v3-git-247863708315.asia-south2.run.app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: sankatmochan-509100
          workload_identity_provider: projects/247863708315/locations/global/workloadIdentityPools/github-saarthi/providers/github-saarthi-provider
          service_account: saarthi-github-deployer@sankatmochan-509100.iam.gserviceaccount.com
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy hosting and Firestore rules
        run: |
          npm install --global firebase-tools
          firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting --non-interactive --token "${{ steps.auth.outputs.access_token }}"
