name: Isolated watcher prototype verification
on:
  pull_request:
    paths:
      - 'tests/watcher-prototype/**'
      - 'tests/emulator/package*.json'
      - 'tests/root-firestore-emulator.mjs'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/watcher-prototype-ci.yml'
permissions:
  contents: read
jobs:
  prototype:
    if: github.head_ref == 'codex/issue-50-deployment-verification' || github.head_ref == 'fix/watcher-raw-event-prototype-20261015'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm ci --prefix tests/emulator --ignore-scripts
      - name: Build explicit isolated vendor artifact from verified baseline
        run: |
          node tests/watcher-prototype/prepare.cjs setup
          npm pack firebase-tools@15.33.0 --ignore-scripts --pack-destination .watcher-prototype --silent
          node tests/watcher-prototype/prepare.cjs verify
          tar -xzf .watcher-prototype/firebase-tools-15.33.0.tgz -C .watcher-prototype/vendor/firebase-tools --strip-components=1
          node tests/watcher-prototype/prepare.cjs adapt
          npm pack ./.watcher-prototype/vendor/firebase-tools --ignore-scripts --pack-destination .watcher-prototype --silent
          npm install --prefix .watcher-prototype --ignore-scripts --no-fund
          npm ci --prefix .watcher-prototype --ignore-scripts --no-fund
          node tests/watcher-prototype/prepare.cjs record
      - name: Require clean unsuppressed prototype audit and graph
        run: |
          npm audit --prefix .watcher-prototype --json | tee .watcher-prototype/audit.json
          npm ls --prefix .watcher-prototype firebase-tools chokidar braces
      - name: Validate candidate working emulator lock without committing it
        run: |
          npm install --prefix tests/emulator --save-dev "$PWD/.watcher-prototype/firebase-tools-15.33.0-prototype.0.tgz" --ignore-scripts --no-fund
          npm ci --prefix tests/emulator --ignore-scripts --no-fund
          npm audit --prefix tests/emulator --audit-level=high
          node -e 'const l=require("./tests/emulator/package-lock.json");const p=l.packages; if(p["node_modules/firebase-tools"].version!=="15.33.0-prototype.0" || p["node_modules/chokidar"].version!=="4.0.3" || Object.keys(p).some(x=>x.endsWith("/braces"))) process.exit(1); console.log("PASS: candidate consumer lock uses adapted CLI and no braces")'
          node tests/emulator/node_modules/firebase-tools/lib/bin/firebase.js --version
      - name: Save candidate consumer lock for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-emulator-lock-${{ matrix.os }}
          path: tests/emulator/package-lock.json
          retention-days: 7
      - name: Verify watcher and pattern compatibility
        run: |
          export WEBSITE_ROOT="$PWD"
          export WATCHER_FIXTURE_ROOT="$PWD/.watcher-prototype"
          export WATCHER_ADAPTER="$PWD/.watcher-prototype/node_modules/firebase-tools/lib/reviewed-watcher-prototype.cjs"
          cd .watcher-prototype
          node ../tests/watcher-prototype/compatibility.cjs
          node ../tests/watcher-prototype/extended.cjs
          node ../tests/watcher-prototype/raw-contract.cjs
      - name: Verify real synthetic Firebase integration with adapted CLI
        run: >-
          node .watcher-prototype/node_modules/firebase-tools/lib/bin/firebase.js emulators:exec
          --config firebase.emulators.json --project demo-saarthi-release --only auth,firestore,storage
          'node --test tests/emulator/rules.test.mjs tests/emulator/auth-storage.test.mjs tests/root-firestore-emulator.mjs'
      - name: Verify actual Firestore and Storage rule reload
        run: |
          export WEBSITE_ROOT="$PWD"
          export WATCHER_FIXTURE_ROOT="$PWD/.watcher-prototype"
          node .watcher-prototype/node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --config .watcher-prototype/reload-fixture/firebase.emulators.json --project demo-saarthi-release --only firestore,storage 'node tests/watcher-prototype/rule-reload.cjs'
      - name: Verify CLI command schema without cloud actions
        run: node .watcher-prototype/node_modules/firebase-tools/lib/bin/firebase.js deploy --help > .watcher-prototype/deploy-help.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-watcher-prototype-evidence-${{ matrix.os }}
          path: |
            .watcher-prototype/provenance.json
            .watcher-prototype/audit.json
            .watcher-prototype/adapted-results.json
            .watcher-prototype/adapted-extended-results.json
            .watcher-prototype/deploy-help.txt
          retention-days: 7
