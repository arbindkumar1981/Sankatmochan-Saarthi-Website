name: Working Firebase CLI security and compatibility
on:
  pull_request:
permissions:
  contents: read
jobs:
  working-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tests/emulator --ignore-scripts --no-fund
      - run: npm audit --prefix tests/emulator --audit-level=high
      - run: node tests/watcher-prototype/verify-working.cjs
      - run: node tests/watcher-prototype/rebuild.cjs
      - run: node tests/watcher-prototype/run-contracts.cjs
      - run: npm ci --prefix tests/watcher-prototype/functions --ignore-scripts --no-fund
      - run: npm audit --prefix tests/watcher-prototype/functions --audit-level=high
      - name: Verify actual Functions runtime reload
        run: node tests/watcher-prototype/run-functions.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: node tests/watcher-prototype/prepare.cjs setup
      - name: Verify Firestore and Storage rule reload using working CLI
        run: |
          export WEBSITE_ROOT="$PWD"
          export WATCHER_FIXTURE_ROOT="$PWD/.watcher-prototype"
          node tests/emulator/node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --config .watcher-prototype/reload-fixture/firebase.emulators.json --project demo-saarthi-release --only firestore,storage 'node tests/watcher-prototype/rule-reload.cjs'
      - run: node --test tests/emulator/uuid-compat.test.mjs
      - run: node tests/emulator/node_modules/firebase-tools/lib/bin/firebase.js deploy --help
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: working-cli-evidence-${{ matrix.os }}
          path: |
            .watcher-prototype/*results.json
            vendor/firebase-cli/provenance.json
            tests/emulator/package-lock.json
          retention-days: 14
