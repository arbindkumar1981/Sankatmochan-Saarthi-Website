name: Website CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run lint

      - name: Audit website lockfile
        run: bun audit

      - name: PDF and curriculum tests
        run: bun test tests/*.test.mjs

      - name: Production build
        run: bun run build

      - name: Isolated gateway build with synthetic configuration
        run: bun run build --mode staging-gateway
        env:
          VITE_SAARTHI_API_URL: /api
          VITE_FIREBASE_PROJECT_ID: demo-saarthi-staging
          VITE_FIREBASE_API_KEY: synthetic-not-a-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-saarthi-staging.firebaseapp.com
          VITE_FIREBASE_STORAGE_BUCKET: demo-saarthi-staging.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '123'
          VITE_FIREBASE_APP_ID: synthetic
          VITE_FIRESTORE_DATABASE_ID: (default)
          VITE_CMS_TENANT_ID: school-a

  admin-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix tests/emulator --ignore-scripts --no-fund
      - run: npm audit --prefix tests/emulator
      - run: node tests/emulator/node_modules/eslint/bin/eslint.js .
      - run: node tests/watcher-prototype/verify-working.cjs
      - run: node tests/watcher-prototype/rebuild.cjs
      - name: Real Firestore authorization and forgery tests
        run: node tests/emulator/node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --config firebase.admin-emulators.json --project demo-saarthi-admin --only firestore 'node --test tests/emulator/admin-rules.test.mjs'
