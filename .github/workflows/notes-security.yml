name: Notes private storage security
on:
  pull_request:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix tests/emulator --ignore-scripts --no-fund
      - run: node tests/emulator/node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --config firebase.notes-emulators.json --project demo-saarthi-notes --only firestore,storage 'node --test tests/emulator/notes-storage.test.mjs'
